<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kit Room — Halftime</title>
<meta name="theme-color" content="#F7F1E1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%238C2A1F'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='40' fill='%23F7F1E1'%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/css/halftime.css">
</head>
<body>
<div class="page">

  <header class="header-compact">
    <a class="header-compact__brand" href="../index.html">Halftime</a>
    <nav class="nav" aria-label="Main">
      <a href="../index.html">News</a>
      <a href="../index.html#results">Scores</a>
      <a href="../matches/">Stats</a>
      <a href="../kits/" aria-current="page">Jerseys</a>
    </nav>
  </header>

  <main>
    <div class="page-intro">
      <div class="label label--accent">Catalogue of Football Shirts</div>
      <h1 class="page-intro__title">The Kit Room</h1>
      <p class="page-intro__sub">Find a shirt by decade, by nation, by the day it was worn.</p>
    </div>

    <form class="filters" role="search" onsubmit="return false">
      <label class="filters__label" for="q">Search</label>
      <input class="filters__search" id="q" type="search" placeholder="Nation, club or year" autocomplete="off">
      <!-- One button per decade is added here by kit-room.js, from the years in kits.js. -->
      <div class="filters__group" role="group" aria-label="Decade" id="decades">
        <button type="button" class="chip" data-decade="all" aria-pressed="true">All</button>
      </div>
      <div class="filters__group" role="group" aria-label="Type">
        <button type="button" class="chip chip--accent" data-kind="nation" aria-pressed="false">Nations</button>
        <button type="button" class="chip chip--accent" data-kind="club" aria-pressed="false">Clubs</button>
      </div>
    </form>
    <div class="filters__count" id="kit-count" aria-live="polite"></div>

    <ul class="kit-grid" id="kit-grid"></ul>
  </main>

</div>
<script src="../data/kits.js"></script>
<script src="../assets/js/halftime.js"></script>
<script src="../assets/js/kit-room.js"></script>
</body>
</html>
