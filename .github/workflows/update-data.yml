# Fetches scores, fixtures, goals and lineups, writes the AI news edition,
# commits the generated data files to main, and republishes the site.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   API_FOOTBALL_KEY   from https://dashboard.api-football.com (free plan)
#   OPENAI_API_KEY     from https://platform.openai.com/api-keys
# Optional repository variables: OPENAI_MODEL (default gpt-5.5),
# OPENAI_IMAGE_MODEL (default gpt-image-2), NEWS_IMAGES (all | lead).
# Without a secret, that step is skipped and the previous data is kept.
name: Update data

on:
  schedule:
    # 06:00, 12:00, 18:00 and 23:00 UTC. Each run uses roughly 12 to 36 API-Football
    # requests, well inside the free plan's 100 a day.
    - cron: "0 6,12,18,23 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Print one raw fixture, events and lineups to check field names"
        type: boolean
        default: false
      season:
        description: "Test mode: fetch this season (e.g. 2024) to a temporary file, never to the site"
        type: string
        default: ""
      force_news:
        description: "Write a fresh edition even if the headlines have not changed"
        type: boolean
        default: false

permissions:
  contents: write

# Its own queue: a site publish triggered by a code push must never cancel a data run.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # continue-on-error: a provider problem must not stop the news from being written.
      - name: Fetch scores, fixtures and lineups
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: ${{ inputs.season }}
        run: node scripts/fetch-scores.mjs ${{ inputs.probe && '--probe' || '' }}

      - name: Collect headlines from the news feeds
        run: node scripts/fetch-news.mjs

      - name: Write the news edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FORCE_NEWS: ${{ inputs.force_news && '1' || '' }}
        run: node scripts/write-news.mjs

      - name: Draw the illustrations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          NEWS_IMAGES: ${{ vars.NEWS_IMAGES }}
        run: node scripts/make-images.mjs

      - name: Commit the generated data to main
        id: commit
        run: |
          git config user.name "halftime-bot"
          git config user.email "halftime-bot@users.noreply.github.com"
          git add public/data/results.js public/data/news.js public/images/news data-cache
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update scores and news ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # main may have moved while this ran (other pushes); rebase onto it and retry.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push attempt $attempt failed; retrying in 10 seconds."
              sleep 10
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by the workflow does not trigger publish.yml, so publish here.
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        run: touch public/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "Publish site from ${{ github.sha }} (data update)"
